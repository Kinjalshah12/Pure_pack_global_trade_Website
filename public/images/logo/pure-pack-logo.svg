<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#0A9396"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="box-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#0083B0"/>
    </linearGradient>
    <linearGradient id="box-right" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A9396"/>
      <stop offset="100%" stop-color="#005F73"/>
    </linearGradient>
    <linearGradient id="box-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B2545"/>
      <stop offset="100%" stop-color="#134074"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark (Isometric Cube with Orbital Globe Ring) -->
  <g transform="translate(10, 10)">
    <!-- Outer Orbital Ring -->
    <ellipse cx="40" cy="40" rx="36" ry="14" fill="none" stroke="url(#logo-grad)" stroke-width="3.5" transform="rotate(-25 40 40)" stroke-dasharray="180" stroke-dashoffset="10" filter="url(#glow)"/>
    
    <!-- Isometric Cube / Pack -->
    <!-- Top Face -->
    <path d="M40 16 L62 27 L40 38 L18 27 Z" fill="url(#box-top)"/>
    <!-- Left Face -->
    <path d="M18 27 L40 38 L40 64 L18 53 Z" fill="url(#box-left)"/>
    <!-- Right Face -->
    <path d="M40 38 L62 27 L62 53 L40 64 Z" fill="url(#box-right)"/>
    
    <!-- Accent Core Lines -->
    <path d="M40 16 L40 38" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <path d="M40 38 L18 27" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
    <path d="M40 38 L62 27" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>

    <!-- Orbital Node Dot -->
    <circle cx="68" cy="22" r="3.5" fill="#D4AF37" filter="url(#glow)"/>
  </g>

  <!-- Typography -->
  <text x="100" y="44" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="800" font-size="25" fill="#FFFFFF" letter-spacing="1">
    PURE PACK
  </text>
  <text x="100" y="66" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-weight="600" font-size="13" fill="#00B4D8" letter-spacing="3.5">
    GLOBAL TRADE
  </text>
  
  <rect x="100" y="74" width="230" height="2" fill="url(#logo-grad)" rx="1"/>
</svg>
